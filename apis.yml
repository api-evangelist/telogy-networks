name: Telogy Networks
description: 'Telogy Networks was one of the first companies to deliver software solutions
  enabling voice over IP (VoIP) networks. Founded in 1989 and headquartered in Germantown,
  Maryland, the company built the Golden Gateway telephony software and DSP-resident voice/fax
  media processing stacks that were embedded into carrier and enterprise gateway equipment.
  Backed by Lightspeed Venture Partners (invested 1997), ABS Ventures, Ameritech Development,
  Catalyst Venture Partners, and Novak Biddle Venture Partners, Telogy Networks was acquired
  by Texas Instruments in 1999 for roughly $457 million, where its VoIP media-gateway software
  became the basis of TI''s telephony DSP product line. Telogy no longer operates as an
  independent entity and publishes no developer portal, public API, or SDK. This record is
  retained in the API Evangelist network as a historical VC-portfolio company profile.'
